<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Rating Study</title>

  <!-- jsPsych 7 core -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet">

  <!-- jsPsych plugins -->
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-select@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-audio-button-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>

  <!-- Firebase SDK (modular v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #f8f9fa;
    }

    .jspsych-content {
      max-width: 800px;
      font-size: 18px;
      line-height: 1.6;
    }

    .jspsych-btn {
      font-size: 18px !important;
      padding: 12px 28px !important;
      border-radius: 10px !important;
      background-color: #4a90d9;
      color: white;
      border: none;
      cursor: pointer;
      margin: 8px;
    }

    .jspsych-btn:hover {
      background-color: #357abd;
    }

    .study-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .study-header h1 {
      font-size: 2rem;
      color: #333;
    }

    .instructions-box {
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 2rem;
      margin: 1rem 0;
      text-align: left;
    }

    .sample-card {
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 2rem;
      margin: 1rem auto;
      max-width: 600px;
    }

    .sample-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: #333;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background-color: #e0e0e0;
      border-radius: 4px;
      margin: 1rem 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: #4a90d9;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .rating-label {
      font-size: 16px;
      color: #666;
      margin-top: 0.5rem;
    }

    .likert-scale-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 1.5rem 0;
      flex-wrap: wrap;
    }

    .likert-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #4a90d9;
      background: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      color: #4a90d9;
    }

    .likert-btn:hover {
      background-color: #4a90d9;
      color: white;
      transform: scale(1.1);
    }

    .likert-btn.selected {
      background-color: #4a90d9;
      color: white;
      transform: scale(1.15);
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.4);
    }

    .scale-labels {
      display: flex;
      justify-content: space-between;
      max-width: 400px;
      margin: 0 auto;
      font-size: 14px;
      color: #888;
    }

    .jspsych-survey-multi-choice-question {
      margin-bottom: 1.5rem !important;
      text-align: left !important;
    }

    .jspsych-survey-multi-choice-text {
      font-size: 16px !important;
      font-weight: 600 !important;
    }

    .jspsych-survey-likert-statement {
      font-size: 16px !important;
    }

    .completion-screen {
      text-align: center;
      padding: 2rem;
    }

    .completion-screen h2 {
      color: #28a745;
      font-size: 2rem;
    }

    audio {
      width: 100%;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>
  <script src="experiment.js"></script>
</body>
</html>
