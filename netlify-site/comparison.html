<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Comparison Study</title>

  <!-- jsPsych 7 core -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet">

  <!-- jsPsych plugins -->
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-select@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>

  <!-- Firebase SDK (modular v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #f8f9fa;
    }

    .jspsych-content {
      max-width: 900px;
      font-size: 18px;
      line-height: 1.6;
    }

    .jspsych-btn {
      font-size: 18px !important;
      padding: 12px 28px !important;
      border-radius: 10px !important;
      background-color: #4a90d9;
      color: white;
      border: none;
      cursor: pointer;
      margin: 8px;
    }

    .jspsych-btn:hover {
      background-color: #357abd;
    }

    .study-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .study-header h1 {
      font-size: 2rem;
      color: #333;
    }

    .instructions-box {
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 2rem;
      margin: 1rem 0;
      text-align: left;
    }

    .comparison-card {
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 2rem;
      margin: 1rem auto;
      max-width: 800px;
    }

    .audio-pair {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 2rem;
      margin: 1.5rem 0;
    }

    .audio-side {
      flex: 1;
      text-align: center;
      padding: 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background: #fafafa;
    }

    .audio-side.left {
      border-color: #e67e22;
    }

    .audio-side.right {
      border-color: #27ae60;
    }

    .audio-side h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.1rem;
    }

    .audio-side.left h3 {
      color: #e67e22;
    }

    .audio-side.right h3 {
      color: #27ae60;
    }

    .audio-side audio {
      width: 100%;
      margin-top: 0.5rem;
    }

    .vs-divider {
      display: flex;
      align-items: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #999;
      padding-top: 1.5rem;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background-color: #e0e0e0;
      border-radius: 4px;
      margin: 1rem 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: #4a90d9;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .likert-scale-container {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 1.5rem 0;
      flex-wrap: wrap;
    }

    .likert-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90px;
    }

    .likert-label {
      font-size: 11px;
      color: #888;
      text-align: center;
      margin-top: 4px;
      line-height: 1.2;
    }

    .likert-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid #4a90d9;
      background: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      color: #4a90d9;
    }

    .likert-btn:hover {
      background-color: #4a90d9;
      color: white;
      transform: scale(1.1);
    }

    .likert-btn.selected {
      background-color: #4a90d9;
      color: white;
      transform: scale(1.15);
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.4);
    }

    .scale-endpoints {
      display: flex;
      justify-content: space-between;
      margin: 0 1rem;
      font-size: 13px;
      font-weight: 600;
    }

    .scale-endpoints .left-label {
      color: #e67e22;
    }

    .scale-endpoints .right-label {
      color: #27ae60;
    }

    .completion-screen {
      text-align: center;
      padding: 2rem;
    }

    .completion-screen h2 {
      color: #28a745;
      font-size: 2rem;
    }

    .rating-label {
      font-size: 16px;
      color: #666;
      margin-top: 0.5rem;
      text-align: center;
    }

    audio::-webkit-media-controls-timeline {
      pointer-events: none;
    }

    .listen-timer-msg {
      text-align: center;
      font-size: 14px;
      margin-top: 0.5rem;
      padding: 6px 12px;
      border-radius: 6px;
    }

    .listen-timer-msg.waiting {
      color: #c0392b;
      background: #fdf0ed;
    }

    .listen-timer-msg.ready {
      color: #27ae60;
      background: #eafaf1;
    }

    .sample-card {
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 2rem;
      margin: 1rem auto;
      max-width: 800px;
    }

    @media (max-width: 600px) {
      .audio-pair {
        flex-direction: column;
        gap: 1rem;
      }
      .vs-divider {
        padding-top: 0;
      }
      .likert-item {
        width: 70px;
      }
    }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>
  <script src="comparison.js"></script>
</body>
</html>
